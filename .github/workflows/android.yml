name: Construir la app Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk paso-a-paso-ayuda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: paso-a-paso-ayuda
          path: paso-a-paso-ayuda.apk

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Paso a Paso Ayuda 0.1.${{ github.run_number }}
          files: paso-a-paso-ayuda.apk
          make_latest: true
